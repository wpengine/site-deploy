name: Docker Build and Push

# The registry's Workload Identity provider only trusts this file name, called
# from refs/heads/main.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build.'
        required: true
        type: string
      version:
        description: 'Version (X.Y.Z) to tag. Also tags latest.'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Generate tags
        id: tags
        env:
          VERSION: ${{ inputs.version }}
          GAR_IMAGE: ${{ secrets.GAR_IMAGE }}
        run: |
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          TAGS=("latest" "$MAJOR" "$MAJOR.$MINOR" "$MAJOR.$MINOR.$PATCH")
          {
            echo "TAGS<<EOF"
            for image in wpengine/site-deploy "$GAR_IMAGE"; do
              for tag in "${TAGS[@]}"; do
                echo "$image:$tag"
              done
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "GAR_HOST=${GAR_IMAGE%%/*}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Login to Artifact Registry
        run: gcloud auth configure-docker ${{ steps.tags.outputs.GAR_HOST }} --quiet

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.TAGS }}
          # No cache - we want fresh base image layers for security patches
          no-cache: true
